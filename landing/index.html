<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>25600.design</title>
    <meta
      name="description"
      content="25,600% is Figma’s maximum zoom. This is a collection of practical
        studies by Vitalii Sazanov: take exceptional UI from people known for
        uncommon care, put it under the loupe, and rebuild it from scratch —
        every detail, note for note."
    />
    <meta
      name="theme-color"
      content="#f4f4f1"
      data-light="#f4f4f1"
      data-dark="#1c1c20"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      {
        let stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch {}
        const isDark =
          stored === 'dark' ||
          (!stored && matchMedia('(prefers-color-scheme: dark)').matches);
        const theme = isDark ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', isDark);
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = themeColor.dataset[theme];
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
